# Builds the one-file Windows program and the ready-to-unzip kit.
# Runs when a release is published (and attaches the zip to it), when a tag like v1.0 is pushed, or by hand from the Actions tab.
name: Build Windows kit
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build MaddenRosterKit.exe
        working-directory: kit
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --console --name MaddenRosterKit --paths . --paths lib madden_kit.py
      - name: Package the kit
        shell: pwsh
        run: |
          $d = "MaddenRosterKit"
          New-Item -ItemType Directory $d, "$d/input", "$d/output" | Out-Null
          Copy-Item kit/dist/MaddenRosterKit.exe $d/
          Copy-Item -Recurse kit/rosters, kit/data $d/
          Copy-Item kit/README.txt, CREDITS.md $d/
          Copy-Item kit/input/sample_players.csv "$d/input/"
          Push-Location $d
          # Smoke test: the program must build a roster from the sample list and file it in a month folder.
          $log = "" | .\MaddenRosterKit.exe input\sample_players.csv SMOKE --no-copy 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log
          $ros = Get-ChildItem -Recurse output -Filter SMOKE.ros -ErrorAction SilentlyContinue
          if (-not $ros) {
            $tail = ($log -split "`n" | Select-Object -Last 15) -join " | "
            Write-Host "::error::Smoke test failed (exit $code): $tail"
            exit 1
          }
          $global:LASTEXITCODE = 0
          Write-Host "Smoke test passed: $($ros.FullName) ($($ros.Length) bytes)"
          Get-ChildItem output | Remove-Item -Recurse -Force
          Remove-Item input/sample_players.csv
          Pop-Location
          Compress-Archive -Path $d -DestinationPath MaddenRosterKit-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaddenRosterKit-windows
          path: MaddenRosterKit-windows.zip
      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MaddenRosterKit-windows.zip
